name: shfmt
base: core22
version: "3.12.0"
# https://github.com/snapcore/snapd/blob/master/spdx/licenses.go
license: "BSD-3-Clause"
summary: A shell parser, formatter and interpreter (POSIX/Bash/mksh).
description: |
  "A shell parser, formatter and interpreter (POSIX/Bash/mksh)."

confinement: strict
grade: stable
architectures:
  - build-on: amd64

plugs:
  dot-editorconfig:
    interface: personal-files
    read:
      - $HOME/.editorconfig

parts:
  shfmt:
    plugin: go
    source: https://github.com/mvdan/sh.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    build-snaps:
      - go/latest/stable
    stage:
      - bin/shfmt

apps:
  shfmt:
    command: bin/shfmt
    plugs:
      - home
      - network
      - dot-editorconfig
